{% extends 'base.html' %}
{% block content %}
<style>
    .auth-form { display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 0 auto; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    input, button { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    .checkbox-group { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.4; }
    .checkbox-group input { margin-top: 3px; }
</style>

<div style="text-align: center; margin-bottom: 25px;">
    <h2>Регистрация личного кабинета</h2>
    <p style="color: #666;">Создайте профиль для сохранения истории питания и рецептов в облаке.</p>
</div>

<form class="auth-form" method="POST" action="{{ url_for('register') }}">
    <div class="form-group">
        <label>Ваше имя / Никнейм</label>
        <input type="text" name="name" placeholder="Например: Иван" required>
    </div>
    <div class="form-group">
        <label>Email (Логин для входа)</label>
        <input type="email" name="email" placeholder="example@mail.ru" required>
    </div>
    <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" placeholder="Придумайте надежный пароль" required>
    </div>
    
    <div class="checkbox-group">
        <input type="checkbox" name="accept_terms" id="accept_terms" required>
        <label for="accept_terms">
            Я даю **Согласие на обработку моих персональных данных** (Email, имя, параметры тела) в соответствии с Федеральным законом № 152-ФЗ для обеспечения работы калькулятора калорий.
        </label>
    </div>
    
    <button type="submit">Зарегистрироваться</button>
</form>
{% endblock %}
